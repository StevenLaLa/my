<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>給維晞寶寶 ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      background:
        radial-gradient(circle at 50% 40%, #3b1827 0%, #180d16 45%, #08060a 100%);

      color: white;
    }

    /* =========================
       Background stars
       ========================= */

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.2;
        transform: scale(0.7);
      }

      50% {
        opacity: 1;
        transform: scale(1.3);
      }
    }

    /* =========================
       Main card
       ========================= */

    .container {
      width: min(90%, 520px);
      text-align: center;

      position: relative;
      z-index: 2;

      padding: 42px 30px;

      border-radius: 28px;

      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45);

      animation: appear 1.5s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       Heart
       ========================= */

    .heart {
      font-size: 55px;
      margin-bottom: 20px;

      animation:
        heartbeat 1.5s infinite ease-in-out,
        heartAppear 1.5s ease;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.18);
      }
    }

    @keyframes heartAppear {
      from {
        opacity: 0;
        transform: scale(0);
      }

      to {
        opacity: 1;
      }
    }

    /* =========================
       Title
       ========================= */

    h1 {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 3px;
      margin: 0 0 25px;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.65);
      font-size: 14px;
      margin-bottom: 35px;
    }

    /* =========================
       Button
       ========================= */

    .open-button {
      border: none;
      outline: none;

      padding: 14px 32px;

      border-radius: 999px;

      color: white;
      font-size: 16px;

      background: linear-gradient(
        135deg,
        #d86b87,
        #a94464
      );

      box-shadow:
        0 8px 25px rgba(210, 80, 120, 0.3);

      cursor: pointer;

      transition: 0.3s;
    }

    .open-button:hover {
      transform: translateY(-3px);
      box-shadow:
        0 12px 30px rgba(210, 80, 120, 0.45);
    }

    .open-button:active {
      transform: scale(0.95);
    }

    /* =========================
       Letter
       ========================= */

    .letter {
      display: none;

      text-align: left;

      animation: letterAppear 1.2s ease;
    }

    @keyframes letterAppear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .letter-title {
      text-align: center;

      font-size: 26px;
      margin-bottom: 30px;
    }

    .message {
      white-space: pre-line;

      font-size: 16px;
      line-height: 2;

      color: rgba(255, 255, 255, 0.9);

      min-height: 150px;
    }

    .signature {
      margin-top: 30px;

      text-align: right;

      font-size: 15px;

      color: rgba(255, 255, 255, 0.65);
    }

    /* =========================
       Final question
       ========================= */

    .question {
      margin-top: 35px;

      text-align: center;

      font-size: 18px;

      opacity: 0;

      animation: questionAppear 1s ease 2s forwards;
    }

    @keyframes questionAppear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       Floating hearts
       ========================= */

    .floating-heart {
      position: fixed;

      bottom: -30px;

      font-size: 20px;

      pointer-events: none;

      animation: floatUp 5s linear forwards;

      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.7);
      }

      10% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translateY(-110vh) scale(1.3) rotate(20deg);
      }
    }

    /* =========================
       Mobile
       ========================= */

    @media (max-width: 500px) {
      .container {
        padding: 35px 24px;
      }

      h1 {
        font-size: 24px;
      }

      .message {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- Background -->
  <div class="stars" id="stars"></div>


  <!-- Main -->
  <div class="container">

    <!-- First screen -->
    <div id="opening">

      <div class="heart">
        ❤️
      </div>

      <h1>
        給維晞寶寶
      </h1>

      <button class="open-button" onclick="openLetter()">
        點開看看
      </button>

    </div>


    <!-- Letter -->
    <div class="letter" id="letter">

      <div class="letter-title">
        寶寶，對不起 ❤️
      </div>

      <div class="message" id="message"></div>

      <div class="signature">
        — 永遠在乎你的人
      </div>

      <div class="question">
        希望你原諒我 🥺
      </div>

    </div>

  </div>


  <script>

    /* =========================================
       ★★★ 你只需要修改這裡 ★★★
       ========================================= */

    const apologyMessage =
`寶寶對不起，

剛剛一開始沒有顧慮到你的感受，是我不對😿
你的感受對我來說很重要，我會改進的。
對不起，寶寶。`;

    /* ========================================= */


    // Create stars
    const starsContainer = document.getElementById("stars");

    for (let i = 0; i < 70; i++) {

      const star = document.createElement("div");

      star.className = "star";

      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";

      star.style.animationDelay =
        Math.random() * 3 + "s";

      star.style.opacity =
        Math.random();

      starsContainer.appendChild(star);
    }


    // Open letter
    function openLetter() {

      const opening =
        document.getElementById("opening");

      const letter =
        document.getElementById("letter");

      opening.style.display = "none";

      letter.style.display = "block";

      typeWriter();

      startHearts();
    }


    // Typewriter effect
    function typeWriter() {

      const message =
        document.getElementById("message");

      let index = 0;

      message.innerHTML = "";

      function type() {

        if (index < apologyMessage.length) {

          message.innerHTML +=
            apologyMessage[index];

          index++;

          setTimeout(type, 45);

        }

      }

      type();
    }


    // Floating hearts
    function createHeart() {

      const heart =
        document.createElement("div");

      heart.className =
        "floating-heart";

      const hearts = [
        "❤️",
        "💕",
        "💗",
        "💖",
        "💓"
      ];

      heart.innerHTML =
        hearts[Math.floor(Math.random() * hearts.length)];

      heart.style.left =
        Math.random() * 100 + "vw";

      heart.style.animationDuration =
        (4 + Math.random() * 3) + "s";

      heart.style.fontSize =
        (15 + Math.random() * 20) + "px";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }


    function startHearts() {

      setInterval(() => {

        createHeart();

      }, 800);

    }

  </script>

</body>
</html>
